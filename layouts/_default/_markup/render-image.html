{{- /* サキのAIニュース(ai-times)のスライド画像だけ図版扱いにする。CTA画像や他セクションは従来通り */ -}}
{{- if and (eq .Page.Section "ai-times") (hasPrefix .Destination "https://lh3.googleusercontent.com/") -}}
<figure class="ai-slide">
  <a href="{{ .Destination | safeURL }}" target="_blank" rel="noopener" aria-label="スライドを拡大表示">
    <img src="{{ .Destination | safeURL }}" alt="{{ .Text }}" loading="lazy">
  </a>
  {{- with .Text }}<figcaption class="ai-slide-cap">{{ . }}</figcaption>{{ end -}}
</figure>
{{- else -}}
<img src="{{ .Destination | safeURL }}" alt="{{ .Text }}"{{ with .Title }} title="{{ . }}"{{ end }} loading="lazy">
{{- end -}}
